minimum_prek_version = "0.5.10"

[update]
cooldown_days = 7
freeze = true
include_tags = "v*"
exclude_tags = ["*-{alpha,beta,rc}*"]
repos = {
  "https://github.com/python-jsonschema/check-jsonschema" = { include_tags = "*" },
  "https://github.com/astral-sh/uv-pre-commit" = { include_tags = "*" }
}

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "82d21874c3242e4dc27bb47641c996902ef64eef"  # frozen: v0.27
hooks = [
  { id = "validate-pyproject" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "a76b92851fc9eede9f9bc4073eb55202f34eb0df"  # frozen: 0.39.0
hooks = [
  { id = "check-github-workflows" },
  { id = "check-renovate", additional_dependencies = ['json5'] },
]

# zizmor detects security vulnerabilities in GitHub Actions workflows
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "06a39750ec31860bb44f2acf67182c40016cd1e7"  # frozen: v1.32.0
hooks = [
  { id = "zizmor", args = ["--no-progress", "--fix"] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "d1df990f871e616da38bb602a2671d5e840b9989"  # frozen: 0.13.7
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c"  # frozen: v0.17.3
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter", "markdown"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "9389fceae2108b9cc4a7dd47d5bd0f62be2ffd08"  # frozen: v0.0.96
hooks = [
  { id = "ty" },
]
