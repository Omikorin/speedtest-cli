minimum_prek_version = "0.4.12"

[update]
cooldown_days = 7
freeze = true
include_tags = "v*"
exclude_tags = ["*-{alpha,beta,rc}*"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7"  # frozen: v0.25
hooks = [
  { id = "validate-pyproject" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "6b63472e72e1a91ed8a2f6d483790dfb644fa1d3" # frozen: 0.37.4
hooks = [
  { id = "check-github-workflows" },
]

# zizmor detects security vulnerabilities in GitHub Actions workflows
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "067260dc5fe6ea86b7551bfd6f8b3ba4e6c93129"  # frozen: v1.28.0
hooks = [
  { id = "zizmor", args = ["--no-progress", "--fix"] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "36bed8143874b34d77931e1236de048cf551e940" # frozen: 0.11.30
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "39d9ac5938dadb73df0564a45f163e25ff9fa6e2" # frozen: v0.16.1
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter", "markdown"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "ac85803d0443afba1e0700690366fd2d39e02580" # frozen: v0.0.65
hooks = [
  { id = "ty" },
]
