minimum_prek_version = "0.5.10"

[update]
cooldown_days = 7
freeze = true
include_tags = "v*"
exclude_tags = ["*-{alpha,beta,rc}*"]
repos = {
  "https://github.com/python-jsonschema/check-jsonschema" = { include_tags = "*" },
  "https://github.com/astral-sh/uv-pre-commit" = { include_tags = "*" }
}

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "82d21874c3242e4dc27bb47641c996902ef64eef"  # frozen: v0.27
hooks = [
  { id = "validate-pyproject" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "a76b92851fc9eede9f9bc4073eb55202f34eb0df"  # frozen: 0.39.0
hooks = [
  { id = "check-github-workflows" },
  { id = "check-renovate", additional_dependencies = ['json5'] },
]

# zizmor detects security vulnerabilities in GitHub Actions workflows
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "06a39750ec31860bb44f2acf67182c40016cd1e7"  # frozen: v1.32.0
hooks = [
  { id = "zizmor", args = ["--no-progress", "--fix"] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "b9d5257d60a86c20fd9a3919d548e08ba5ab905b"  # frozen: 0.13.8
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "ef6cf06c079dd6b299dfc720b0f14400c9d168e1"  # frozen: v0.17.5
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter", "markdown"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "d598b95ef3cba3cf3a31c40620c3481ae978e4eb"  # frozen: v0.0.104
hooks = [
  { id = "ty" },
]
