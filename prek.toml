minimum_prek_version = "0.5.0"

[update]
cooldown_days = 7
freeze = true
include_tags = "v*"
exclude_tags = ["*-{alpha,beta,rc}*"]
repos = {
  "https://github.com/python-jsonschema/check-jsonschema" = { include_tags = "*" },
  "https://github.com/astral-sh/uv-pre-commit" = { include_tags = "*" }
}

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7"  # frozen: v0.25
hooks = [
  { id = "validate-pyproject" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "12e63946db2c5cfcc9030fac21c3883ba88c6ed8"  # frozen: 0.38.0
hooks = [
  { id = "check-github-workflows" },
  { id = "check-renovate" },
]

# zizmor detects security vulnerabilities in GitHub Actions workflows
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "451b56af716f9f0d0c2b816503a3fd0cf8b036fa"  # frozen: v1.29.0
hooks = [
  { id = "zizmor", args = ["--no-progress", "--fix"] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "b84c4a0a90bd58c7d82ae8f0d4d5e77b1ddd3ce6"  # frozen: 0.12.5
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "aab412d509121cb5f7533134b7e67f9fab59c682"  # frozen: v0.16.4
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter", "markdown"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "e0bc482078af7eee1555b1f01d27e618d2212720"  # frozen: v0.0.73
hooks = [
  { id = "ty" },
]
