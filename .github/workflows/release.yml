name: Release

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Python index to release to"
        required: true
        default: "pypi"
        type: choice
        options:
          - "pypi"
          - "testpypi"
  # push:
  #   tags:
  #     # Publish on any tag starting with a `v`, e.g., v1.2.3
  #     - v*

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build
        run: uv build

      - name: Publish
        run: |
          if [ "${{ github.event.inputs.index }}" = "pypi" ]; then
            uv publish
          else
            uv publish --index "${{ github.event.inputs.index }}"
          fi
