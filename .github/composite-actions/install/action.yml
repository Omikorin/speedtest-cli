name: 'Install'
description: 'Sets up uv and runs install'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        quiet: true

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras --dev
