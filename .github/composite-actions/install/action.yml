name: 'Install'
description: 'Sets up uv and runs install'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        quiet: true

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras --dev
