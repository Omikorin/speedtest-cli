name: 'Install'
description: 'Sets up uv and runs install'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        quiet: true

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras --dev
