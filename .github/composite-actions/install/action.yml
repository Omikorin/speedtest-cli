name: 'Install'
description: 'Sets up uv and runs install'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        quiet: true

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras --dev
