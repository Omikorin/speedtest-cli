name: 'Install'
description: 'Sets up uv and runs install'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        quiet: true

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras --dev
