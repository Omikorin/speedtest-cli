name: "Install"
description: "Sets up uv and runs install"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        # quiet: true # TODO: think about this later

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras --dev
