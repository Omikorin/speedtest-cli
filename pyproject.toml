[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedtest-cli-ng"
version = "0.2.0"
authors = [
    {name = "Michał Korczak", email = "git@omikor.in"}
    # TODO: I'm not sure whether I should put the old author because of possible spam for him unknowingly etc
    # {name = "Matt Martz", email = "matt@sivel.net"}
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Next generation CLI for testing internet bandwidth using speedtest.net"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["speedtest", "speedtest.net", "bandwidth", "internet", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "httpx2>=2.5.0,<3",
    "rich>=15.0.0,<16",
]

[project.urls]
Homepage = "https://github.com/Omikorin/speedtest-cli"
Source = "https://github.com/Omikorin/speedtest-cli"
Issues = "https://github.com/Omikorin/speedtest-cli/issues"

[project.scripts]
speedtest = "speedtest.__main__:main"
speedtest-cli = "speedtest.__main__:main"

# Tool-specific configurations
[tool.setuptools.packages.find]
include = ["speedtest", "speedtest.*"]

[tool.setuptools.data-files]
"share/man/man1" = ["extras/man/speedtest-cli.1"]

[tool.uv]
required-version = ">=0.11.0"
exclude-newer = "7 days"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 120
src = ["speedtest", "tests"]

[tool.ruff.lint]
select = [
    "ANN", # flake8 annotations
    "B",   # flake8 bugbear
    "PYI", # flake8 pyi
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8 naming
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
preview = true
ignore = []
unfixable = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.pytest]
minversion = "9.0"
# Automatically show extra test info, fail if coverage drops, and output a terminal coverage report
addopts = ["-v", "--cov=speedtest", "--cov-report=term-missing"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    # Tests
    "pytest>=9.0.0,<10",
    "pytest-cov>=7.0.0,<8",
    # Linting
    "ruff>=0.15.0,<1",
    "ty>=0.0.55,<1",
]
